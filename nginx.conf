user www-data;
worker_processes 1;

error_log /dev/stderr info;
pid /tmp/nginx.pid;

env PROXY_BASIC;

events {
    worker_connections 4096;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    map_hash_bucket_size 128;

    lua_shared_dict proxy_metrics 4m;

    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 3s;

    # The default is available before a server rewrite phase. Lua overwrites
    # this changeable map variable with the authenticated user or "-".
    map $http_proxy_authorization $proxy_user_id {
        default "-";
    }

    # Only these Registry hosts may be selected by the HTTPS cache listener.
    # These loopback names are only local-test aliases.  They let the local
    # cache endpoint at 127.0.0.1:25443 use the default Hangzhou upstream;
    # they do not change DNS for registry.cn-hangzhou.aliyuncs.com.
    map $host $registry_upstream_host {
        default "";
        127.0.0.1 registry.cn-hangzhou.aliyuncs.com;
        localhost registry.cn-hangzhou.aliyuncs.com;
        registry-cache.local registry.cn-hangzhou.aliyuncs.com;
    }

    map $server_port $upstream_target {
        8080    $http_host;
        443     "$registry_upstream_host:443";
        default "-";
    }

    proxy_cache_path /data/registry-aliyun-blobs
        levels=1:2
        keys_zone=registry_aliyun_blobs:16m
        max_size=1g
        inactive=30d
        use_temp_path=off;

    log_format proxy_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"request":"$request",'
        '"method":"$request_method",'
        '"status":$status,'
        '"user_id":"$proxy_user_id",'
        '"host":"$host",'
        '"uri":"$uri",'
        '"request_length":$request_length,'
        '"bytes_sent":$bytes_sent,'
        '"upstream_cache_status":"$upstream_cache_status",'
        '"upstream_target":"$upstream_target",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_time":$request_time'
        '}';

    access_log /dev/stdout proxy_json;

    init_by_lua_block {
        ngx.shared.proxy_metrics:set("auth_failures", 0)
    }

    # Forward proxy for ordinary HTTP and HTTP/1.x CONNECT.
    server {
        listen 8080;
        server_name _;

        proxy_connect;
        proxy_connect_allow 80 443;
        proxy_connect_connect_timeout 10s;
        proxy_connect_data_timeout 120s;

        # proxy_connect handles CONNECT before the normal access phase.  The
        # rewrite-enabled module patch makes this hook run for CONNECT too.
        rewrite_by_lua_block {
            local header = ngx.req.get_headers()["proxy-authorization"]
            if type(header) == "table" then
                header = header[1]
            end

            local function reject(reason)
                local metrics = ngx.shared.proxy_metrics
                metrics:incr("auth_failures", 1, 0)
                metrics:incr("auth_failure_" .. reason, 1, 0)
                ngx.header["Proxy-Authenticate"] = 'Basic realm="forward-proxy"'
                ngx.header["Cache-Control"] = "no-store"
                return ngx.exit(407)
            end

            -- Authentication is optional for compatibility with existing
            -- unauthenticated clients.  If a client supplies credentials,
            -- still validate them and reject invalid credentials.
            if not header then
                ngx.var.proxy_user_id = "-"
                ngx.shared.proxy_metrics:incr("requests_total|-", 1, 0)
                return
            end

            local encoded = header:match("^[Bb]asic%s+(.+)$")
            if not encoded then
                return reject("scheme")
            end

            local decoded = ngx.decode_base64(encoded)
            local expected = os.getenv("PROXY_BASIC") or "proxy-user:proxy-token"
            if not decoded or decoded ~= expected then
                return reject("invalid")
            end

            local user = decoded:match("^([^:]+):") or "unknown"
            ngx.var.proxy_user_id = user
            ngx.shared.proxy_metrics:incr("requests_total|" .. user, 1, 0)
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass_request_headers on;
            proxy_set_header Proxy-Authorization "";
            proxy_set_header Host $http_host;
            proxy_pass http://$http_host$request_uri;
        }

        log_by_lua_block {
            local user = ngx.var.proxy_user_id or "-"
            local bytes = tonumber(ngx.var.bytes_sent) or 0
            ngx.shared.proxy_metrics:incr("bytes_to_client|" .. user, bytes, 0)
        }
    }

    # A dedicated HTTPS frontend for Aliyun. Blob redirects are internally
    # followed by the named location below, allowing Nginx to cache the final
    # 200 object instead of returning the 307 to the client.
    server {
        listen 443 ssl;
        server_name _;
        client_max_body_size 0;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering on;
        ssl_certificate     /etc/openresty/certs/tls-origin.crt;
        ssl_certificate_key /etc/openresty/certs/tls-origin.key;

        if ($registry_upstream_host = "") { return 444; }

        location / {
            proxy_cache off;
            proxy_ssl_server_name on;
            proxy_ssl_name $registry_upstream_host;
            proxy_pass https://$registry_upstream_host;
            proxy_set_header Host $registry_upstream_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ "^/v2/(.+)/blobs/(sha256:[0-9a-f]{64}|sha512:[0-9a-f]{128})$" {
            # Cache only the final OSS 200 response, never the Registry 307.
            proxy_cache off;
            # 25443 is the published local HTTPS port; production should use
            # the public cache hostname instead of this fixed localhost URL.
            proxy_redirect ~^https://([A-Za-z0-9.-]+)(/.*)$ https://$http_host/_aliyun_oss/$1$2;

            proxy_ssl_server_name on;
            proxy_ssl_name $registry_upstream_host;
            proxy_pass https://$registry_upstream_host;
            proxy_set_header Host $registry_upstream_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header X-Blob-Cache $upstream_cache_status always;
        }

        # The client follows the rewritten local Location. This request is
        # cacheable and keeps the original signed query while keying storage
        # only by the stable OSS host/path.
        location ~ "^/_aliyun_oss/([A-Za-z0-9.-]+)(/.*)$" {
            set $oss_host $1;
            set $oss_path $2;

            # Only signed Aliyun OSS hosts are eligible; this prevents the
            # cache listener from becoming a generic open proxy.
            if ($oss_host !~* "^(?:[A-Za-z0-9-]+\.)*aliyuncs\.com$") { return 403; }

            proxy_cache registry_aliyun_blobs;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$oss_host$oss_path";
            proxy_cache_valid 200 30d;
            proxy_cache_min_uses 1;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 60s;
            proxy_cache_revalidate on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            proxy_ssl_server_name on;
            proxy_ssl_name $oss_host;
            proxy_pass https://$oss_host$oss_path$is_args$args;
            proxy_set_header Authorization "";
            proxy_set_header Host $oss_host;

            add_header X-Blob-Cache $upstream_cache_status always;
        }
    }

    server {
        listen 9145;
        server_name _;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location = /metrics {
            access_log off;
            content_by_lua_block {
                local d = ngx.shared.proxy_metrics
                ngx.header.content_type = "text/plain; version=0.0.4"
                ngx.say("# TYPE forward_proxy_requests_total counter")
                ngx.say("# TYPE forward_proxy_auth_failures_total counter")
                ngx.say("# TYPE forward_proxy_bytes_to_client_total counter")

                for _, key in ipairs(d:get_keys(1000)) do
                    local value = d:get(key) or 0
                    local user = key:match("^requests_total|(.+)$")
                    if user then
                        ngx.say('forward_proxy_requests_total{user_id="', user, '"} ', value)
                    end
                    local bytes_user = key:match("^bytes_to_client|(.+)$")
                    if bytes_user then
                        ngx.say('forward_proxy_bytes_to_client_total{user_id="', bytes_user, '"} ', value)
                    end
                end

                ngx.say("forward_proxy_auth_failures_total ", d:get("auth_failures") or 0)
            }
        }
    }

}
